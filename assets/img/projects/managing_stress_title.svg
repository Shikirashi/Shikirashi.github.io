<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Managing Stress</title>
  <desc id="desc">Typography-based cover graphic for Managing Stress, a browser game about balancing study and rest.</desc>
  <rect width="1200" height="675" fill="#14202b"/>
  <rect x="54" y="54" width="1092" height="567" rx="5" fill="none" stroke="#647585" stroke-width="2"/>
  <text x="94" y="121" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="23" letter-spacing="6" fill="#a9c0d0">AN INTERACTIVE WEB GAME</text>
  <text x="94" y="291" font-family="Arial, Helvetica, sans-serif" font-size="105" font-weight="800" letter-spacing="0" fill="#ffffff">MANAGING</text>
  <text x="94" y="415" font-family="Arial, Helvetica, sans-serif" font-size="124" font-weight="800" letter-spacing="0" fill="#ffffff">STRESS</text>
  <line x1="94" y1="473" x2="1106" y2="473" stroke="#8aa3af" stroke-width="2"/>
  <text x="94" y="541" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="1" fill="#d9e4e9">STUDY  /  REST  /  CHOOSE</text>
  <text x="94" y="585" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#97aeba">Five days until the exam. Every choice matters.</text>
