name: Retire superseded Projects preview branch
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/retire-projects-preview.yml
permissions:
  contents: write
jobs:
  remove-preview-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged-in-substance preview/projects-page branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/preview/projects-page"
